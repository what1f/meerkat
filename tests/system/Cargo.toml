[package.metadata.lankide.e2e-additional.web]
command = "just web-e2e"
scenario = "Desktop title strip hit testing, boot visibility in Chinese/English and light/dark without animation ticks, first-launch dark text, and B4.1 navigation and event-driven Workspace refresh on the Runtime-served frontend. Verify normal API-created members with empty environment and CLI path run, preserve their model through member-specific hold/release and complete owner first reply. Verify group mentions, held/released runs, pinned pairing of an isolated second Machine and the migrated execution machine_id. Drive real Feishu scan waiting, scanned, expiry and completion and Telegram Token onboarding over mock networks; verify owner private replies through Runtime first-reply state and typed outbound chats. Freeze the rig during a held remote run and prove parent timeout cleanup terminates owned Machine and Harness process groups before removing homes. Verify missing task-owner authorization displays the generic localized Chinese/English failure message promptly without automatic retries or member-creation instructions, preserves retry and disable controls across reload, and recovers after actual member onboarding."
prerequisites = "pnpm dependencies and Playwright Chromium installed; no live accounts"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[package.metadata.lankide.e2e-additional.system-startup]
command = "cargo test -p lankide-system-e2e --test e2e startup_recovery_e2e::"
scenario = "Preserve on-shift intent and expose setup errors after a one-time mock IM initialization failure or a real missing Agent column in an isolated SQLite database; after restart or schema repair, clear the error and deliver exactly one scripted Harness reply. Preserve an explicitly paused team. Provider reconfiguration retry clears setup errors without changing shift intent; a failed owner request to go on shift is retried on restart."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"
