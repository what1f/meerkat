[package.metadata.lankide.e2e-additional.system-member-fields]
command = "cargo test -p lankide-system-e2e --test e2e member_fields_e2e::"
scenario = "Verify A4d management GET of all imported figure frames with exact PNG bytes, Content-Type, existing no-store policy, local Host/Origin guards, typed missing-resource errors, rejection of HTML/SVG attachments, CSP sandbox on raster images and unchanged token-only execution route. Verify A4a.1-A4a.4 through real Runtime and Machine daemons with scripted Harness and mock IM: import and persist four figure frames, reject missing frames and traversal without residue, preserve independent argv across session replacement, observe busy events before releasing a held run and idle after completion, and query Machine-scoped model catalogs with distinct thinking levels and empty-level execution."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[package.metadata.lankide.e2e-additional.system-provider-management]
command = "cargo test -p lankide-system-e2e --test e2e provider_management_e2e::"
scenario = "Verify A4b through real Runtime management HTTP, concrete Feishu and Telegram Providers, mock IM/network and scripted Harness: owner get/refresh with workspace avatars, expired authorization retains cached profile, same-tenant switch succeeds while cross-tenant and cancelled switches preserve the old owner, task list create/complete/reopen and external invalidation preserve the list across disable/enable, and only a successful owner private reply satisfies first-reply state across Runtime restart. Reject in-flight cancelled account switches without restoring pending data or replacing credentials, keep workspace authorization usable after deleting its granting member, recognize a private owner reply from a later execution, initialize the list on first enable, and invalidate every task event while the task system is enabled, including unrelated, moved, deleted and inaccessible tasks; disabled task events and ordinary IM messages do not invalidate, after consuming local mutation events. Missing task-owner authorization fails promptly with a stable authorization_required detail, makes no task IM calls, writes exactly one secret-free categorized daemon diagnostic, and recovers through actual member onboarding. Recover missing owner authorization by QR sign-in with an existing same-creator member App, including absent workspace App credentials and tenant metadata, without adding members or migrating data. Expose the generated owner ready/needs_sign_in contract, reject unavailable Apps and mismatched initial creators, persist needs_sign_in and cached profiles on expired/revoked user tokens with workspace invalidation, fail locally until re-login, survive Runtime restart, and keep scope/resource/rate-limit/server errors distinct from authentication failures."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[package.metadata.lankide.e2e-additional.system-harness-test]
command = "cargo test -p lankide-system-e2e --test e2e harness_test_e2e::"
scenario = "Verify A4c.1-A4c.4 through management HTTP and two real Machines: selected Harness replies with real argv, environment, model and thinking settings; missing CLI fails; hung execution times out within 30 seconds; success and timeout remove process trees and temporary directories without changing members, executions, messages, IM sends or management events. Review: inject a 1200 ms relative budget through the rig network fixture, hang before session bind, and require timed_out within two seconds with CLI, child and temporary directory already removed."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

