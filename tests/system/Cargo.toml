[package]
name = "lankide-system-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
futures-util.workspace = true
tokio-tungstenite.workspace = true
lankide-protocol = { path = "../../crates/protocol" }
lankide-core = { path = "../../crates/core" }
lankide-provider = { path = "../../crates/provider" }
lankide-runtime = { path = "../../crates/runtime" }
lankide-storage = { path = "../../crates/storage" }
lankide-harness = { path = "../../crates/harness", features = ["test-support"] }
lankide-computer = { path = "../../crates/computer" }
lankide-client = { path = "../../crates/client" }
lankide-runtime-daemon = { path = "../../apps/runtime-daemon" }
lankide-computer-daemon = { path = "../../apps/computer-daemon" }
lankide-cli = { path = "../../apps/lankide-cli" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
rusqlite.workspace = true
tempfile.workspace = true

[[bin]]
name = "system-harness"
path = "tests/support/peer.rs"
test = false
bench = false

[package.metadata.lankide.e2e]
command = "cargo test -p lankide-system-e2e"
scenario = "Mention one Agent in a group, queue a message during its run, and restart the Computer during a run; verify chat replies and execution isolation through both real daemons over authenticated JSON/WS Computer links. Verify S4.1-S4.3: classify spawn and mid-turn failures, preserve original diagnostics in client details and Computer logs, and keep failures out of every chat. S1.1 routes a DM only to its receiving Agent, S1.2 isolates two bot conversations with the same person, and S1.3 preserves unmentioned group attention policies. Verify S7.1: a Harness without Steer queues the next message and records no native steer; absent Resume starts fresh and absent Cancel closes a running Agent during deletion. S5.1-S5.8 cover model repair, third-attempt recovery, five-attempt limits, repeated fingerprints, durable notice dedupe, localized private notices, Runtime restart during backoff, and owner resume of queued messages."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[package.metadata.lankide.e2e-additional.system-liveness]
command = "cargo test -p lankide-system-e2e --test execution_liveness_e2e"
scenario = "Verify S6.1-S6.4 through real daemons: idle timeout releases the next queued message, progress extends idle but not the total budget, timeout kills the Harness and its child, and management cancellation stops the process tree within grace plus one second. Verify timeout backoff before the next queued message and close/kill fallback without native cancel when Cancel is absent."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[package.metadata.lankide.e2e-additional.system-computer-link]
command = "cargo test -p lankide-system-e2e --test computer_link_e2e"
scenario = "Verify S9.1: reject a newer Computer version with a typed close reason, expose it through the Computer error API and management catalog, and clear it on a compatible reconnect. Verify S9.2: separate Runtime and Computer homes reply once to a mention using only loopback WS and a copied secret. Reject missing or wrong credentials, malformed JSON, unknown frame types, and oversized messages; keep local discovery files private and valid Computers working."
prerequisites = "None"
unattended = "yes"
status = "implemented"
classification = "hermetic"
