[package]
name = "lankide-system-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lankide-protocol = { path = "../../crates/protocol" }
lankide-core = { path = "../../crates/core" }
lankide-provider = { path = "../../crates/provider" }
lankide-runtime = { path = "../../crates/runtime" }
lankide-storage = { path = "../../crates/storage" }
lankide-harness = { path = "../../crates/harness", features = ["test-support"] }
lankide-computer = { path = "../../crates/computer" }
lankide-client = { path = "../../crates/client" }
lankide-runtime-daemon = { path = "../../apps/runtime-daemon" }
lankide-computer-daemon = { path = "../../apps/computer-daemon" }
lankide-cli = { path = "../../apps/lankide-cli" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
rusqlite.workspace = true
tempfile.workspace = true

[[bin]]
name = "system-harness"
path = "tests/support/peer.rs"
test = false
bench = false

[package.metadata.lankide.e2e]
command = "cargo test -p lankide-system-e2e"
scenario = "Mention one Agent in a group, queue a message during its run, and restart the Computer during a run; verify chat replies and execution isolation through both real daemons. Verify S4.1-S4.3: classify spawn and mid-turn failures, preserve original diagnostics in client details and Computer logs, and keep failures out of every chat. S1.1 routes a DM only to its receiving Agent, S1.2 isolates two bot conversations with the same person, and S1.3 preserves unmentioned group attention policies. Verify S7.1: a Harness without Steer queues the next message and records no native steer; absent Resume starts fresh and absent Cancel closes a running Agent during deletion. S5.1-S5.8 cover model repair, third-attempt recovery, five-attempt limits, repeated fingerprints, durable notice dedupe, localized private notices, Runtime restart during backoff, and owner resume of queued messages."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"
