[package.metadata.meerkat.e2e-additional.system-member-fields]
command = "cargo test -p meerkat-system-e2e --test e2e member_fields_e2e::"
scenario = "Verify A4d management GET of all imported figure frames with exact PNG bytes, Content-Type, existing no-store policy, local Host/Origin guards, typed missing-resource errors, rejection of HTML/SVG attachments, CSP sandbox on raster images and unchanged token-only execution route. Verify A4a.1-A4a.4 through real Runtime and Machine daemons with scripted Harness and mock IM: import and persist four figure frames, reject missing frames and traversal without residue, preserve independent argv across session replacement, observe busy events before releasing a held run and idle after completion, and query Machine-scoped model catalogs with distinct thinking levels and empty-level execution."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[package.metadata.meerkat.e2e-additional.system-provider-management]
command = "cargo test -p meerkat-system-e2e --test e2e provider_management_e2e::"
scenario = "Create each Feishu App through official device registration, confirm standard permissions and events, and enroll its registration creator by applications/me union identity with per-App open ID. Use official tenant_key to reject cross-enterprise enrollment, elect only the first human as team lead, display contact profiles with unavailable-profile fallback, preserve identity across Apps and stranger-first IM, and edit positions without granting authority. Verify expiry, refusal, administrator approval waiting, no developer-session or user OAuth calls, tenant-token tasklists and callbacks, and Telegram profiles and first replies. Sync Feishu and Telegram human profiles in the background with persistent cross-bot one-hour attempt throttling, retain missing fields and unchanged avatar resources, preserve message replies during held or failed contact calls, exclude external people, and permit manual refresh inside the hour with fallback to another readable App. Sync directory-v1 signatures independently of contact-v3 profiles during enrollment, messages and manual refresh; preserve denied or missing fields, clear explicit empty values, include signatures in identity prompts without granting authority, and wait for the signature scope during registration."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[package.metadata.meerkat.e2e-additional.system-harness-test]
command = "cargo test -p meerkat-system-e2e --test e2e harness_test_e2e::"
scenario = "Verify A4c.1-A4c.4 through management HTTP and two real Machines: selected Harness replies with real argv, environment, model and thinking settings; missing CLI fails; hung execution times out within 30 seconds; success and timeout remove process trees and temporary directories without changing members, executions, messages, IM sends or management events. Review: inject a 1200 ms relative budget through the rig network fixture, hang before session bind, and require timed_out within two seconds with CLI, child and temporary directory already removed."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[[bin]]
name = "system-web-rig"
path = "tests/support/web_rig.rs"
test = false
