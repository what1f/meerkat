[package.metadata.meerkat.e2e-additional.web]
command = "just web-e2e"
scenario = "Browser and Desktop use a centered bottom glass dock with three accessible icon destinations and an upward team menu containing localized New team and Settings actions. Desktop title content starts at x=92 in normal windows and x=24 in fullscreen; browser titles start at x=24. Verify both window sizes and themes, clickable member back controls, dock clearance for the last badge row, and an empty team containing exactly one centered sleeve that opens member creation. Saved badge names use rounded bold type; ASCII roles use uppercase tracking while Chinese roles remain untracked. Model pickers use UI type for display names and mono for source IDs; badge and screen model readouts stay mono. Native traffic-light geometry, native Settings menu and CmdOrCtrl+, and fullscreen state synchronization require actual-window review. Desktop title strip hit testing, boot visibility in Chinese/English and light/dark without animation ticks, first-launch dark text, and B4.1 navigation and event-driven Workspace refresh on the Runtime-served frontend. Verify normal API-created members with empty environment and CLI path run, preserve their model through member-specific hold/release and complete owner first reply. Verify group mentions, held/released runs, pinned pairing of an isolated second Machine and the migrated execution machine_id. Drive official Feishu device registration waiting, expiry, refusal, permissions confirmation and administrator approval and Telegram Token onboarding over mock networks; verify owner private replies through Runtime first-reply state and typed outbound chats. Freeze the rig during a held remote run and prove parent timeout cleanup terminates owned Machine and Harness process groups before removing homes. Verify an unavailable task list displays localized Chinese/English retry and disable controls, and recovers after member onboarding. Web task rows are read-only with default cursors and reject task writes; the list title saves on Enter or blur, cancels on Escape, ignores empty/unchanged values, and rolls back on Feishu PATCH failure. Remote task events refresh the list. Reject cross-enterprise creators with Chinese/English messages. Show one contact-profile badge per human, serialize rapid position saves while preserving newer drafts and recovering from failed writes, restore cancelled edits, keep names, avatars and signatures read-only, and omit empty biographies, status dots and model footers. Flip human cards in place, manually sync with busy and error feedback in both languages, return to the updated front on success, and open position editing from the back. Incoming messages update human names, pictures and signatures while the bot replies. Show signatures on small and detail badges, preserve missing or denied signatures, clear explicit empty values, and retain them after reload. Retry expired registration with a new QR, confirm permissions through the official link, wait for effective capabilities, and require a new registration for each App without duplicating its creator. Reuse a late Telegram connection after switching providers and finish registration without management events cancelling in-flight onboarding polls."
prerequisites = "pnpm dependencies and Playwright Chromium installed; no live accounts"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[package.metadata.meerkat.e2e-additional.system-startup]
command = "cargo test -p meerkat-system-e2e --test e2e startup_recovery_e2e::"
scenario = "Preserve on-shift intent and expose setup errors after a one-time mock IM initialization failure or a real missing Agent column in an isolated SQLite database; after restart or schema repair, clear the error and deliver exactly one scripted Harness reply. Preserve an explicitly paused team. Provider reconfiguration retry clears setup errors without changing shift intent; a failed owner request to go on shift is retried on restart."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"
