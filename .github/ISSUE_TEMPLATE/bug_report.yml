name: Bug report
description: Report a reproducible bug in Meerkat
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Please avoid attaching credentials, tokens, private workspace identifiers, or logs containing sensitive data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Meerkat version / commit
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS & integration
      description: macOS/Linux version, messaging app (Feishu / Telegram), and agent harness (Meerkat / Claude Code / Codex / Pi).
      placeholder: macOS 15.x, Feishu, Claude Code
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove any tokens, workspace IDs, or personal paths before pasting.
