name: Build tools
description: Install the pinned Meerkat build toolchain.
inputs:
  with-zig:
    description: Install the pinned Zig compiler.
    required: false
    default: 'true'
  with-uv:
    description: Install the pinned uv tool.
    required: false
    default: 'true'
  cache-node:
    description: Cache the pnpm store via actions/setup-node.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: 1.96.0
        components: rustfmt
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        package_json_file: apps/web/package.json
    - if: inputs.cache-node == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24.11.1
        cache: pnpm
        cache-dependency-path: |
          apps/web/pnpm-lock.yaml
          site/pnpm-lock.yaml
    - if: inputs.cache-node != 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24.11.1
    - if: inputs.with-zig == 'true'
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: 0.17.0
    - if: inputs.with-uv == 'true'
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      with:
        version: 0.9.5
        enable-cache: 'false'
    - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
      with:
        tool: just@1.43.1
    - name: Ensure ripgrep is available
      shell: bash
      run: |
        if ! command -v rg >/dev/null; then
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install ripgrep
          else
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
        fi
