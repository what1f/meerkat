name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the tag, versions and protected branch ancestry
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: ./scripts/release-preflight

  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.preflight.outputs.commit }}

  macos-build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MEERKAT_INSTALL_SCRIPT_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.tag }}/install.sh
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          with-uv: 'false'
          rust-targets: ${{ matrix.target }}
          rust-cache-key: release-${{ matrix.target }}
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-deny@0.20.2
      - name: Audit the exact desktop target before building
        env:
          TARGET: ${{ matrix.target }}
        run: ./scripts/verify-dependency-advisories "$TARGET" desktop
      - name: Build the release binaries once
        env:
          TARGET: ${{ matrix.target }}
        run: ./scripts/build-release "$TARGET"
      - name: Preserve executable modes and build provenance
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p target/release target/build-output
          for binary in meerkat-desktop meerkatd meerkat-machine meerkat; do
            lipo "target/$TARGET/release/$binary" -verify_arch "$ARCH"
            install -m 0755 "target/$TARGET/release/$binary" "target/release/$binary"
          done
          cp "target/$TARGET/release/build-provenance.json" target/release/build-provenance.json
          ./scripts/release-provenance verify --binary-dir target/release --output target/release/build-provenance.json
          COPYFILE_DISABLE=1 tar -cf target/build-output/build.tar \
            target/release/meerkat-desktop target/release/meerkatd \
            target/release/meerkat-machine target/release/meerkat \
            target/release/build-provenance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: build-macos-${{ matrix.arch }}
          path: target/build-output/build.tar
          if-no-files-found: error
          retention-days: 14

  macos-sign:
    needs: [preflight, verify, macos-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    environment: release
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      RUST_TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      MEERKAT_INSTALL_SCRIPT_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.tag }}/install.sh
      MEERKAT_RELEASE_SIGNING: '1'
      MEERKAT_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      MEERKAT_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      MEERKAT_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      MEERKAT_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - name: Require all signing and notarization credentials
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          for name in CERTIFICATE CERTIFICATE_PASSWORD NOTARY_KEY MEERKAT_CODESIGN_IDENTITY MEERKAT_APPLE_TEAM_ID MEERKAT_NOTARY_KEY_ID MEERKAT_NOTARY_ISSUER; do
            [[ -n "${!name}" ]] || { echo "Missing release configuration: $name" >&2; exit 1; }
          done
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.9.5
          enable-cache: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-macos-${{ matrix.arch }}
          path: target/build-input
      - name: Restore the exact unsigned build
        run: tar -xf target/build-input/build.tar -C .
      - uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      - name: Prepare the notarization key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/meerkat-notary.p8"
          echo "MEERKAT_NOTARY_KEY=$RUNNER_TEMP/meerkat-notary.p8" >> "$GITHUB_ENV"
      - name: Sign, notarize and package the desktop
        run: ./scripts/package-macos
      - name: Verify the final desktop distribution
        env:
          MEERKAT_PACKAGE_VERIFICATION_OUTPUT: target/release/desktop-verification.json
        run: ./scripts/verify-package
      - name: Package the Machine from the same binaries
        env:
          MEERKAT_MACHINE_BIN_DIR: target/release
        run: ./scripts/package-machine "$RUST_TARGET"
      - name: Verify the native Machine installer
        run: ./scripts/verify-machine-package "target/machine-packages/meerkat-machine-$VERSION-macos-$ARCH.tar.gz"
      - name: Collect only verified distribution files
        run: |
          mkdir -p target/distribution
          base="Meerkat-$VERSION-macos-$ARCH"
          cp "target/release/$base.zip" "target/release/$base.dmg" "target/release/$base.sha256" target/distribution/
          cp target/release/build-provenance.json "target/distribution/$base.build.json"
          cp target/release/package-provenance.json "target/distribution/$base.package.json"
          cp target/release/desktop-verification.json "target/distribution/$base.verification.json"
          cp target/machine-packages/* target/distribution/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: release-macos-${{ matrix.arch }}
          path: target/distribution/
          if-no-files-found: error
          retention-days: 14
      - name: Retain signing and package diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-macos-${{ matrix.arch }}
          path: |
            target/notarization/
            target/e2e-artifacts/package/
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/meerkat-notary.p8"
    defaults:
      run:
        shell: bash

  linux:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      RUST_TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      MEERKAT_INSTALL_SCRIPT_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.tag }}/install.sh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          with-zig: 'true'
          with-uv: 'false'
          rust-targets: ${{ matrix.target }}
          rust-cache-key: release-${{ matrix.target }}
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-zigbuild@0.20.1,cargo-deny@0.20.2
      - name: Install Linux desktop system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - name: Audit the exact Linux target before building
        run: ./scripts/verify-dependency-advisories "$RUST_TARGET" desktop
      - name: Native portable business scenarios
        run: |
          cargo build --locked -p meerkat-machine --example machine_daemon_e2e
          cargo test --locked -p meerkat-protocol -p meerkat-daemon-runtime -p meerkat-machine -p meerkat-harness-builtin -p meerkat-runtime --tests
      - name: Build and package Linux Desktop
        run: |
          ./scripts/build-release "$RUST_TARGET"
          ./scripts/package-linux "$RUST_TARGET"
      - name: Verify the native Linux Desktop package
        run: |
          python3 ./scripts/verify-desktop-package.py \
            "target/$RUST_TARGET/release/Meerkat-$VERSION-linux-$ARCH.tar.gz" \
            --build-provenance "target/$RUST_TARGET/release/build-provenance.json" \
            --output "target/$RUST_TARGET/release/desktop-verification.json"
      - name: Build and package Linux Machine against glibc 2.28
        run: ./scripts/package-machine "$RUST_TARGET"
      - name: Verify the native Machine installer
        run: ./scripts/verify-machine-package "target/machine-packages/meerkat-machine-$VERSION-linux-$ARCH.tar.gz"
      - name: Collect verified Linux distribution files
        run: |
          mkdir -p target/distribution
          base="Meerkat-$VERSION-linux-$ARCH"
          cp "target/$RUST_TARGET/release/$base.tar.gz" "target/$RUST_TARGET/release/$base.sha256" target/distribution/
          cp "target/$RUST_TARGET/release/build-provenance.json" "target/distribution/$base.build.json"
          cp "target/$RUST_TARGET/release/desktop-verification.json" "target/distribution/$base.verification.json"
          cp target/machine-packages/* target/distribution/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: release-linux-${{ matrix.arch }}
          path: target/distribution/
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      RUST_TARGET: x86_64-pc-windows-msvc
      ARCH: x86_64
      MEERKAT_INSTALL_SCRIPT_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.tag }}/install.sh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          with-uv: 'false'
          with-zig: 'false'
          rust-targets: x86_64-pc-windows-msvc
          rust-cache-key: release-x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-deny@0.20.2
      - name: Install NSIS for Windows installer packaging
        run: |
          if ! command -v makensis >/dev/null 2>&1 && [[ ! -f "/c/Program Files (x86)/NSIS/makensis.exe" ]] && [[ ! -f "/c/Program Files/NSIS/makensis.exe" ]]; then
            choco install nsis --version=3.11 -y --no-progress
          fi
          if command -v makensis >/dev/null 2>&1; then
            makensis -VERSION
          elif [[ -f "/c/Program Files (x86)/NSIS/makensis.exe" ]]; then
            "/c/Program Files (x86)/NSIS/makensis.exe" -VERSION
          else
            "/c/Program Files/NSIS/makensis.exe" -VERSION
          fi
      - name: Audit the exact Windows target before building
        run: ./scripts/verify-dependency-advisories "$RUST_TARGET" desktop
      - name: Native Windows portable scenarios
        run: cargo test --locked --target "$RUST_TARGET" -p meerkat-daemon-runtime -p meerkat-harness-builtin -p meerkat-runtime --tests
      - name: Build and package Windows Desktop
        run: |
          ./scripts/build-release "$RUST_TARGET"
          python ./scripts/package-windows.py "$RUST_TARGET"
      - name: Verify the native Windows Desktop package and installer
        run: |
          python ./scripts/verify-desktop-package.py \
            "target/$RUST_TARGET/release/Meerkat-$VERSION-windows-$ARCH.zip" \
            --build-provenance "target/$RUST_TARGET/release/build-provenance.json" \
            --output "target/$RUST_TARGET/release/desktop-verification.json" \
            --verify-installer
      - name: Package the Windows Machine from the same binaries
        env:
          MEERKAT_MACHINE_BIN_DIR: target/x86_64-pc-windows-msvc/release
        run: ./scripts/package-machine "$RUST_TARGET"
      - name: Verify the native Windows Machine installer
        run: python ./scripts/verify-machine-package "target/machine-packages/meerkat-machine-$VERSION-windows-$ARCH.zip"
      - name: Collect verified Windows distribution files
        run: |
          mkdir -p target/distribution
          base="Meerkat-$VERSION-windows-$ARCH"
          cp "target/$RUST_TARGET/release/$base.zip" "target/$RUST_TARGET/release/$base-setup.exe" "target/$RUST_TARGET/release/$base.sha256" target/distribution/
          cp "target/$RUST_TARGET/release/build-provenance.json" "target/distribution/$base.build.json"
          cp "target/$RUST_TARGET/release/desktop-verification.json" "target/distribution/$base.verification.json"
          cp target/machine-packages/* target/distribution/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: release-windows-x86_64
          path: target/distribution/
          if-no-files-found: error
          retention-days: 14

  source:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - run: mkdir -p target/source
      - name: Generate the source dependency SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          syft-version: v1.27.1
          output-file: target/source/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Export the exact release source
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mkdir -p target/source
          git archive --format=tar.gz --prefix="Meerkat-$VERSION/" HEAD > "target/source/Meerkat-$VERSION-source.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: release-source
          path: target/source/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [preflight, verify, macos-sign, linux, windows, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: target/release-inputs
      - name: Verify the full release matrix and create the manifest
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
        run: ./scripts/release-assets --source target/release-inputs --output target/publish --version "$VERSION" --commit "$COMMIT"
      - name: Attest every final file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: target/publish/*
      - name: Upload, verify and publish the complete Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: ./scripts/publish-release target/publish
