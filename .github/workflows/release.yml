name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: taiki-e/install-action@just
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: astral-sh/setup-uv@v6
      - name: Match tag and app version
        run: |
          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' apps/desktop/Cargo.toml | head -n 1)"
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
            echo "Tag $GITHUB_REF_NAME does not match app version $version" >&2
            exit 1
          }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Package
        run: just package
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="target/release/Meerkat-$VERSION-macos-arm64"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            "$base.zip" "$base.dmg" "$base.sha256"
