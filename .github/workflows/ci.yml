name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install web dependencies
        run: pnpm -C apps/web install --frozen-lockfile
      - name: Check
        run: just check
      - name: Business scenarios
        env:
          MEERKAT_HERMETIC_SKIP_WEB: '1'
        run: just test
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/e2e-artifacts/
          retention-days: 7

  web-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          with-uv: 'false'
          rust-cache-key: web-e2e
      - name: Install web dependencies
        run: pnpm -C apps/web install --frozen-lockfile
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
      - name: Install Chromium browser
        run: |
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == 'true' ]]; then
            pnpm -C apps/web exec playwright install-deps chromium
          else
            pnpm -C apps/web exec playwright install --with-deps chromium
          fi
      - name: Web browser scenarios
        run: |
          pnpm -C apps/web build
          cargo build --locked -p meerkat-system-e2e --bins
          pnpm -C apps/web e2e
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-web-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/e2e-artifacts/
            apps/web/test-results/
          retention-days: 7

  linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          with-uv: 'false'
          with-zig: 'false'
          rust-cache-key: ci-linux-desktop
      - name: Install Linux desktop system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - name: Build web assets and verify Linux workspace compilation
        run: |
          pnpm -C apps/web install --frozen-lockfile
          pnpm -C apps/web build
          cargo check --workspace --all-targets --locked
      - name: Native Linux portable business scenarios
        run: |
          cargo build --locked -p meerkat-machine --example machine_daemon_e2e
          cargo test --locked -p meerkat-protocol -p meerkat-daemon-runtime -p meerkat-machine --tests

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          with-uv: 'false'
          with-zig: 'false'
          rust-targets: x86_64-pc-windows-msvc
          rust-cache-key: ci-windows-x86_64
      - name: Build web assets and verify Windows product binaries
        run: |
          pnpm -C apps/web install --frozen-lockfile
          pnpm -C apps/web build
          cargo check --locked --target x86_64-pc-windows-msvc --features meerkat-desktop/custom-protocol --bin meerkat-desktop --bin meerkatd --bin meerkat-machine --bin meerkat
      - name: Native Windows portable scenarios
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc -p meerkat-daemon-runtime --tests

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm -C site install --frozen-lockfile
      - run: pnpm -C site check
      - run: pnpm -C site build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: site-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/dist/
          if-no-files-found: error
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          with-zig: 'false'
          with-uv: 'false'
          cache-node: 'false'
          cache-rust: 'false'
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Install workflow linter
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Workflow validation
        run: '"$RUNNER_TEMP/bin/actionlint"'
      - name: Full lockfile vulnerability inventory
        if: ${{ !cancelled() }}
        run: cargo audit
      - name: Strict production dependency audit for every release target
        if: ${{ !cancelled() }}
        run: ./scripts/verify-dependency-advisories
      - name: Web vulnerability audit
        if: ${{ !cancelled() }}
        run: pnpm -C apps/web audit --audit-level high
      - name: Site vulnerability audit
        if: ${{ !cancelled() }}
        run: pnpm -C site audit --audit-level high
      - name: Install secret scanner
        if: ${{ !cancelled() }}
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan complete Git history for secrets
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/bin/gitleaks" git --redact --log-opts="--all --full-history -m" .'
      - name: Release pipeline regression scenarios
        if: ${{ !cancelled() }}
        run: python3 tests/release_pipeline_e2e.py
