[package]
autotests = false
name = "meerkat-machine"
version.workspace = true
edition.workspace = true
description = "Meerkat Machine daemon composition root"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
log.workspace = true
async-trait.workspace = true
meerkat-protocol = { path = "../../crates/protocol" }
reqwest.workspace = true
meerkat-machine-core = { path = "../../crates/machine-core" }
meerkat-daemon-runtime = { path = "../../crates/daemon-runtime" }
meerkat-harness = { path = "../../crates/harness" }
meerkat-harness-pi = { path = "../../harnesses/pi" }
meerkat-harness-codex = { path = "../../harnesses/codex" }
meerkat-harness-claude-code = { path = "../../harnesses/claude-code" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }

[lib]
test = false
name = "meerkat_machine"
path = "src/lib.rs"

[[bin]]
test = false
name = "meerkat-machine"
path = "src/main.rs"

[package.metadata.meerkat.e2e]
command = "cargo build --locked -p meerkat-machine --example machine_daemon_e2e && cargo test -p meerkat-machine --test e2e machine_daemon_e2e::"
scenario = "Run the local Machine daemon over a real authenticated Runtime JSON/WS link, with resources over HTTP and Agent calls through private local proxies with three standard Harness choices, interleaved parallel terminal delivery, reconnect/replay, restart, control, resources, and graceful process cleanup. Read idle timeout, total attempt budget, and cancellation grace from the private Machine home configuration with production defaults. Read reconnect backoff, healthy duration, and handshake timeout from machine.json with production defaults. Persist paired credentials and Runtime URL atomically with mode 0600, support pair RUNTIME_URL CODE, and self-pair through local discovery on first start; retain credentials across restarts. Run Agent capability calls over the private JSON socket (S17). Pair and stay in the foreground, persist the certificate pin, reconnect using it, reject non-loopback plaintext, and register the real machine name. Announce the authenticated connection through awaitable Machine readiness; the foreground pairing scenario observes the connected message."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[dev-dependencies]
meerkat-client = { path = "../../crates/client" }
meerkat-runtime = { path = "../../crates/runtime" }
meerkatd = { path = "../daemon" }
tempfile = { workspace = true }
tokio-stream = { workspace = true }
sha2 = { workspace = true }

[package.metadata.meerkat.e2e-additional.machine-daemon-pairing]
command = "cargo build --locked -p meerkat-machine --example machine_daemon_e2e && cargo test -p meerkat-machine --test e2e pairing_cli_e2e::"
scenario = "Run the shipped foreground pair command against a private TLS listener: pair a second Machine using a 256-bit code and certificate pin; reject wrong pins, untrusted certificates, remote plaintext, used codes, and expired codes; reconnect after Runtime and Machine process restarts with the persisted pin; change and clear the address live while local discovery stays online; keep management and resources off the remote listener; verify owner-only identity and credential files and real machine names. Preserve timestamped pairing failure diagnostics in an owner-only home log while retaining foreground stderr."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[[example]]
harness = false
name = "machine_daemon_e2e"
path = "tests/support/runner.rs"
test = false
bench = false

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
