[package]
name = "lankide-computer-daemon"
version.workspace = true
edition.workspace = true
description = "Lankide Computer daemon composition root"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lankide-computer = { path = "../../crates/computer" }
lankide-daemon-runtime = { path = "../../crates/daemon-runtime" }
lankide-harness = { path = "../../crates/harness" }
lankide-harness-pi = { path = "../../harnesses/pi" }
lankide-harness-codex = { path = "../../harnesses/codex" }
lankide-harness-claude-code = { path = "../../harnesses/claude-code" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }

[lib]
name = "lankide_computer_daemon"
path = "src/lib.rs"

[[bin]]
name = "lankide-computer-daemon"
path = "src/main.rs"

[package.metadata.lankide.e2e]
command = "cargo run -p lankide-computer-daemon --example computer-daemon-e2e -- --e2e"
scenario = "Run the local Computer daemon over a real Runtime UDS with three standard Harness choices, interleaved parallel terminal delivery, reconnect/replay, restart, control, resources, and graceful process cleanup. Read idle timeout, total attempt budget, and cancellation grace from the private Computer home configuration with production defaults."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[[example]]
name = "computer-daemon-e2e"
path = "tests/support/runner.rs"

[dev-dependencies]
tempfile = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
lankide-protocol = { path = "../../crates/protocol" }
sha2 = { workspace = true }
