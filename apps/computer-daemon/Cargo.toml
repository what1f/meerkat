[package]
name = "lankide-computer-daemon"
version.workspace = true
edition.workspace = true
description = "Lankide Computer daemon composition root"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lankide-protocol = { path = "../../crates/protocol" }
reqwest.workspace = true
lankide-computer = { path = "../../crates/computer" }
lankide-daemon-runtime = { path = "../../crates/daemon-runtime" }
lankide-harness = { path = "../../crates/harness" }
lankide-harness-pi = { path = "../../harnesses/pi" }
lankide-harness-codex = { path = "../../harnesses/codex" }
lankide-harness-claude-code = { path = "../../harnesses/claude-code" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }

[lib]
name = "lankide_computer_daemon"
path = "src/lib.rs"

[[bin]]
name = "lankide-computer-daemon"
path = "src/main.rs"

[package.metadata.lankide.e2e]
command = "cargo run -p lankide-computer-daemon --example computer-daemon-e2e -- --e2e"
scenario = "Run the local Computer daemon over a real authenticated Runtime JSON/WS link, with resources on UDS/gRPC with three standard Harness choices, interleaved parallel terminal delivery, reconnect/replay, restart, control, resources, and graceful process cleanup. Read idle timeout, total attempt budget, and cancellation grace from the private Computer home configuration with production defaults. Read reconnect backoff, healthy duration, and handshake timeout from computer.json with production defaults. Persist paired credentials and Runtime URL atomically with mode 0600, support pair RUNTIME_URL CODE, and self-pair through local discovery on first start; retain credentials across restarts."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[[example]]
name = "computer-daemon-e2e"
path = "tests/support/runner.rs"

[dev-dependencies]
lankide-client = { path = "../../crates/client" }
lankide-runtime = { path = "../../crates/runtime" }
lankide-runtime-daemon = { path = "../runtime-daemon" }
tempfile = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
sha2 = { workspace = true }

[package.metadata.lankide.e2e-additional.computer-daemon-pairing]
command = "cargo test -p lankide-computer-daemon --test pairing_cli_e2e"
scenario = "Run the shipped pair RUNTIME_URL CODE command against a private real Runtime, accept an HTTP base URL, register its random Computer ID, and atomically store its WebSocket URL and credentials with mode 0600."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"
