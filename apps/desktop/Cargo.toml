[package]
name = "lankide-desktop"
version = "0.1.0"
edition = "2024"
description = "Lankide GPUI management client"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
desktop-ui = { path = "../../crates/desktop-ui" }
lankide-client = { path = "../../crates/client" }
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
anyhow = "1"
serde_json.workspace = true
tokio.workspace = true
tonic.workspace = true
qrcode = { version = "0.14.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[dev-dependencies]
lankide-system-e2e = { path = "../../tests/system" }
lankide-computer-daemon = { path = "../computer-daemon" }
tempfile.workspace = true
tokio-stream.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }

[[bin]]
name = "lankide-desktop"
path = "src/main.rs"

[package.metadata.lankide.e2e]
command = "./apps/desktop/visual-e2e.sh"
scenario = "Review the actual production window across the complete Workspace, Agent, onboarding, resource-image, light and dark scenario set; verify exact source/binary/baseline evidence and owned process cleanup. The bootstrap scenario also proves an unbundled Desktop with a private default home starts transient helpers when no owner runs, and reuses healthy owners without spawning helpers. First launch shows the self-paired local Computer online without a code. Settings and Agent create/edit list registered non-revoked Computers including an offline Computer; new forms default to the local Computer and save explicit placement. Add Computer shows a copyable pairing code and a command only for a remotely addressed listener, localized in English and Chinese."
prerequisites = "macOS window session; authorized live Provider accounts; four product binaries; completed human or Computer Use review via LANKIDE_VISUAL_REVIEW"
classification = "visual-semantic"
unattended = "no; requires actual-window review"
status = "implemented"

[package.metadata.lankide.e2e-additional.desktop-computers]
command = "cargo build --locked --bin lankide-computer-daemon && cargo test -p lankide-desktop --test computer_pairing_e2e"
scenario = "Use the real system rig through the production Desktop UI: reflect local self-pairing without a code, retain an offline Computer, hide revoked Computers, create on the local default and edit placement to the offline Computer, and pair another Computer with the copied dialog code while hiding a loopback command."
prerequisites = "GPUI test platform; private daemon homes"
classification = "hermetic"
unattended = "yes"
status = "implemented"
