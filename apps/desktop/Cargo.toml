[package]
autotests = false
name = "meerkat-desktop"
version = "0.1.0"
edition = "2024"
description = "Meerkat desktop shell"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
meerkat-client = { path = "../../crates/client" }
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri.workspace = true
tauri-plugin-opener.workspace = true
window-vibrancy.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSView", "NSButton", "NSControl", "NSResponder", "NSAlert", "NSApplication"] }
objc2-web-kit = { version = "0.3.2", features = ["WKWebViewConfiguration"] }
objc2-foundation = "0.3.2"
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
test = false
name = "meerkat-desktop"
path = "src/main.rs"

[package.metadata.meerkat.e2e]
command = "./apps/desktop/shell-e2e.sh"
scenario = "Start the shipped headless Tauri Desktop entrypoint with real local services, record the intended navigation to the discovered Runtime origin, reuse healthy owners, replace old helpers through a cold Harness probe on the first launch, report failed helpers, and clean up only owned processes. Window appearance and external-link acceptance belong to C2, including native traffic-light alignment after focus, theme, resize and fullscreen changes."
prerequisites = "Four product binaries in the selected binary directory (target/debug by default); macOS"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[package.metadata.meerkat.e2e-additional.desktop-machines]
command = "cargo build --locked --bin meerkatd --bin meerkat-machine && cargo test -p meerkat-desktop --test e2e machine_pairing_e2e::"
scenario = "Bootstrap real local helpers in private homes, stop only Desktop-owned helpers while reused owners remain running, and replace outdated helpers when Desktop reopens after an update."
prerequisites = "Built meerkatd and meerkat-machine binaries; private daemon homes; macOS"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
