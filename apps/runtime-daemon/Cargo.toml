[package]
name = "lankide-runtime-daemon"
version.workspace = true
edition.workspace = true
description = "Lankide Runtime daemon composition root"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lankide-client = { path = "../../crates/client" }
lankide-core = { path = "../../crates/core" }
lankide-daemon-runtime = { path = "../../crates/daemon-runtime" }
lankide-protocol = { path = "../../crates/protocol" }
lankide-provider = { path = "../../crates/provider" }
lankide-runtime = { path = "../../crates/runtime" }
lankide-provider-feishu = { path = "../../providers/feishu" }
lankide-provider-telegram = { path = "../../providers/telegram" }
lankide-storage = { path = "../../crates/storage" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
lankide-testkit = { path = "../../crates/testkit" }
sha2.workspace = true
tempfile = { workspace = true }
tokio-stream.workspace = true
rusqlite.workspace = true

[[bin]]
name = "lankide-runtime-daemon"
path = "src/main.rs"

[package.metadata.lankide.e2e]
command = "cargo run -p lankide-runtime-daemon --example runtime-daemon-e2e -- --e2e"
scenario = "Boot one Runtime on a private home, exercise owner-authenticated HTTP management and event WebSocket subscriptions including Agent deletion and acknowledged Computer file cleanup and authenticated JSON/WS Computer composition; S3.1 shuts down with a live Computer and running Provider, exits 0 without still_shared and reopens the database; S3.2 exits a duplicate 0 without opening SQLite while the owner serves; S3.3 recovers stale ownership after SIGKILL. Load optional retry-policy.json duration configuration from the private Runtime home. Serve HTTP resources and WS links on one listener, with configurable execution token lifetime. Read Computer heartbeat interval and handshake timeout from runtime.json with production defaults. Serve POST /computers/pair on the shared listener; local discovery secret authorizes pairing only, and pairing validity is configured in runtime.json (default ten minutes). Reconcile the peer active-attempt report before dispatching its queued execution. Agent capabilities and attachment transfers use capability_request/response frames over the Computer WS link and private Computer proxy sockets (S15 system scenarios). Runtime readiness and duplicate-owner health checks use authenticated HTTP and lock files with no Runtime UDS listener (S17)."
prerequisites = "None for hermetic boot check"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[[example]]
name = "runtime-daemon-e2e"
path = "tests/support/runner.rs"
