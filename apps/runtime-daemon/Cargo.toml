[package]
name = "lankide-runtime-daemon"
version.workspace = true
edition.workspace = true
description = "Lankide Runtime daemon composition root"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tonic.workspace = true
lankide-core = { path = "../../crates/core" }
lankide-daemon-runtime = { path = "../../crates/daemon-runtime" }
lankide-protocol = { path = "../../crates/protocol" }
lankide-provider = { path = "../../crates/provider" }
lankide-runtime = { path = "../../crates/runtime" }
lankide-provider-feishu = { path = "../../providers/feishu" }
lankide-provider-telegram = { path = "../../providers/telegram" }
lankide-storage = { path = "../../crates/storage" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
lankide-testkit = { path = "../../crates/testkit" }
sha2.workspace = true
tempfile = { workspace = true }
tokio-stream.workspace = true
lankide-client = { path = "../../crates/client" }
rusqlite.workspace = true

[[bin]]
name = "lankide-runtime-daemon"
path = "src/main.rs"

[package.metadata.lankide.e2e]
command = "cargo run -p lankide-runtime-daemon --example runtime-daemon-e2e -- --e2e"
scenario = "Boot one Runtime over a private local UDS, exercise management including Agent deletion and acknowledged Computer file cleanup, exercise Computer composition, prove graceful shutdown while an idle Computer stream remains connected, and verify restart and single-instance behavior."
prerequisites = "None for hermetic boot check"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[[example]]
name = "runtime-daemon-e2e"
path = "tests/support/runner.rs"
