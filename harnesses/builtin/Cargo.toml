[package]
autotests = false
name = "meerkat-harness-builtin"
version.workspace = true
edition.workspace = true
description = "Built-in Agent Harness adapter for Meerkat"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
futures-util.workspace = true
jimu-agent.workspace = true
jimu-ai.workspace = true
jimu-http.workspace = true
jimu-kit.workspace = true
jimu-schema.workspace = true
jimu-session.workspace = true
jimu-tools.workspace = true
meerkat-harness = { path = "../../crates/harness" }
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
uuid.workspace = true

[dev-dependencies]
meerkat-testkit = { path = "../../crates/testkit" }
tempfile.workspace = true

[package.metadata.meerkat.e2e]
command = "cargo test -p meerkat-harness-builtin --test e2e -- --nocapture"
scenario = "Run the in-process built-in Agent against local OpenAI-compatible Chat Completions endpoints through an API-key connection: reject a wrong key (invalid_key) and a closed endpoint (unreachable) before saving, default to the first listed model, list the connection's models with display names, start with the Machine-shared home, load workspace AGENTS.md and auto-reload skills, keep built-in workspace tools resident while routing dynamic Meerkat host tools through the deferred gateway, stream assistant and reasoning text with usage, search and invoke host tools including added/schema-updated tools after resume, steer a running turn, rebind a non-default model without losing reusability, route a resumed session strictly to the active connection's base_url without leaking credentials to a previous host, cancel a running turn, and sign out. A signed-out home fails with an authentication category before a session starts."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[lib]
test = false
