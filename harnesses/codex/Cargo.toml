[package]
name = "lankide-harness-codex"
version.workspace = true
edition.workspace = true
description = "Codex Harness adapter for Lankide"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lankide-harness = { path = "../../crates/harness" }
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true

[dev-dependencies]
lankide-testkit = { path = "../../crates/testkit" }
tempfile.workspace = true

[package.metadata.lankide.e2e]
command = "LANKIDE_E2E_LIVE=1 cargo test -p lankide-harness-codex --test codex_e2e -- --ignored --nocapture"
scenario = "Start, resume, steer, cancel, and collect output from a Codex native session."
prerequisites = "Codex CLI; gpt-5.6-luna with low reasoning; harness-live prerequisite probe"
classification = "live"
unattended = "yes after live opt-in and preflight"
status = "implemented"
