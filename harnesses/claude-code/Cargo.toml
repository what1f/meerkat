[package]
name = "lankide-harness-claude-code"
version.workspace = true
edition.workspace = true
description = "Claude Code Harness adapter for Lankide"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lankide-core = { path = "../../crates/core" }
lankide-harness = { path = "../../crates/harness" }
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true

[dev-dependencies]
lankide-testkit = { path = "../../crates/testkit" }
tempfile.workspace = true

[package.metadata.lankide.e2e]
command = "LANKIDE_E2E_LIVE=1 cargo test -p lankide-harness-claude-code --test claude_code_e2e -- --ignored --nocapture"
scenario = "Run the configured Claude Code-compatible CLI through native shell execution, session start and resume, stream-json steer, HTTP MCP Tool Result, cancel, close, and process cleanup."
prerequisites = "LANKIDE_CLAUDE_CODE_PATH; configured test model; harness-live prerequisite probe"
classification = "live"
unattended = "yes after live opt-in and preflight"
status = "implemented"

[package.metadata.lankide.e2e-additional.harness-claude-code-hermetic]
command = "cargo test -p lankide-harness-claude-code --test failures_e2e --test native_defaults_e2e"
scenario = "Classify missing CLI, model, authentication, rate-limit, timeout, cancellation, Agent, and process-exit failures through the public native Harness API; retain original error text and stderr. Verify S7.2: bypassPermissions native launch without a tool allowlist or empty setting sources, Agent-home skills at the native project path, and preserved native project skills, settings, and Lankide MCP wiring."
prerequisites = "Python 3"
classification = "hermetic"
unattended = "yes"
status = "implemented"
