[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/protocol",
    "crates/provider",
    "crates/harness",
    "crates/storage",
    "crates/runtime",
    "crates/machine-core",
    "crates/daemon-runtime",
    "crates/client",
    "crates/testkit",
    "crates/web-assets",
    "tests/system",
    "tools/web-types",
    "providers/feishu",
    "providers/telegram",
    "harnesses/builtin",
    "harnesses/pi",
    "harnesses/codex",
    "harnesses/claude-code",
    "apps/daemon",
    "apps/machine",
    "apps/desktop",
    "apps/meerkat-cli",
]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = "symbols"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"
publish = false

[workspace.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-build = "2"
tauri-plugin-opener = "2"
window-vibrancy = "0.7"
log = { version = "0.4", features = ["std"] }
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-tungstenite = { version = "0.26.2", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower = { version = "0.5.2", features = ["util"] }
uuid = { version = "1.18.1", features = ["v4"] }
