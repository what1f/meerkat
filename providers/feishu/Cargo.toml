[package]
name = "lankide-provider-feishu"
version.workspace = true
edition.workspace = true
description = "Feishu Provider adapter for Lankide"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lankide-core = { path = "../../crates/core" }
lankide-provider = { path = "../../crates/provider" }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
prost.workspace = true
futures-util.workspace = true
sha2.workspace = true
tokio-tungstenite.workspace = true
uuid.workspace = true
base64 = "0.23.1"
flate2 = "1.1.9"
url = "2.5.8"

[dev-dependencies]
lankide-testkit = { path = "../../crates/testkit" }
tempfile.workspace = true

[package.metadata.lankide.e2e]
command = "LANKIDE_E2E_LIVE=1 cargo test -p lankide-provider-feishu --test feishu_e2e -- --ignored --nocapture"
scenario = "Run one complete Feishu Provider scenario covering public mention, normalization, and diagnostic contracts together with real receive/send, reply, attachment, reaction, and task behavior. Resolve the receiving Agent from the receiving App for direct messages and reactions."
prerequisites = "Existing secure Feishu fixture; Lankide E2E Chat and Tasklist; feishu-live prerequisite probe"
classification = "live"
unattended = "yes after live opt-in and preflight"
status = "implemented"
