[package]
autotests = false
name = "lankide-storage"
version.workspace = true
edition.workspace = true
description = "Runtime persistence contracts for Lankide"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lankide-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.lankide.e2e]
command = "cargo test -p lankide-storage --test e2e storage_e2e::"
scenario = "Run a fresh version-1 SQLite WAL business lifecycle for Workspaces, Agents, people, direct chats isolated by receiving Agent, messages, Inbox, executions, atomic secrets, hard deletion and durable cleanup. Persist structured failures, retry counts, pause state, notice deduplication and ownership-conflict recovery. Reopen the baseline and reject every unsupported non-zero schema version with a typed error. Preserve queued work across placement changes, increment placement generations and invalidate stale attempt authorizations. Release unassigned preparation claims at startup while retaining attempts for reconciliation; persist Computer loss as a transient failure under the existing retry policy (system reliability scenarios). Persist preparation failure detail atomically with failure and deferred retry. Resolve reaction-target authors within the workspace, channel, chat and receiving account for bot reaction dispatch. Persist simultaneous Workspace conversations and serve management listings without changing transaction or schema semantics (concurrent system scenario). Preserve Agent display names on outbound messages and reactor names in frozen reaction triggers, paired with their target messages (system reaction/name scenarios). Keep multipart sends and their attachments in one outbound row; resolve replies and reactions through every native part. Reserve and bind a first direct conversation for a known human team member. Persist per-Agent group receivers and atomically add accessible conversations to a task at the latest returned message; keep later messages outside that read boundary and remove receiver grants on Agent deletion. Store Runtime-owned Computer names and local identity, preserve names during observation, and refuse removal of local or assigned Computers."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[lib]
test = false
