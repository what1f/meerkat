[package.metadata.lankide.e2e]
command = "cargo test -p lankide-protocol --test protocol_e2e"
scenario = "Exchange Runtime-Computer frames, multi-chunk resources, attachment-only and text message sends, typed management operations, subscriptions, and authorized Agent CLI calls over authenticated JSON/WS Computer links and real UDS/gRPC resource, management, and Agent capability calls; replay after reconnect and reject empty messages plus typed version, size, sequence, offset, and token errors. Carry structured assignment failures and expose per-attempt execution diagnostics through management. Carry management cancellation for an execution through the validated public transport. Carry Harness capability declarations in Computer inventory and cancellation close fallback without a storage schema change. Expose Agent pause reasons and a validated owner resume operation. Serve Computer HTTP resource downloads with attempt tokens and byte ranges on the WS listener; Agent resource RPCs now belong to private Computer proxy sockets. Exchange two-sided JSON heartbeats and bound WebSocket upgrade, hello, and silent-link waits (S10 system scenarios). Carry pairing HTTP requests, device credentials in hello, typed unknown/revoked link rejection, and CreatePairingCode/RevokeComputer management operations. Carry correlated capability_request/response frames with bounded binary chunks, execution context, and typed status errors. Keep Agent gRPC only for private Computer proxies; the production Runtime UDS exposes management only (S15 system scenarios)."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"
