[package.metadata.lankide.e2e]
command = "cargo test -p lankide-protocol --test protocol_e2e"
scenario = "Exchange Runtime-Computer frames, multi-chunk resources, attachment-only and text message sends, typed management operations, subscriptions, and authorized Agent CLI calls over authenticated JSON/WS Computer links and real UDS/gRPC resource, management, and Agent capability calls; replay after reconnect and reject empty messages plus typed version, size, sequence, offset, and token errors. Carry structured assignment failures and expose per-attempt execution diagnostics through management. Carry management cancellation for an execution through the validated public transport. Carry Harness capability declarations in Computer inventory and cancellation close fallback without a storage schema change. Expose Agent pause reasons and a validated owner resume operation. Exchange two-sided JSON heartbeats and bound WebSocket upgrade, hello, and silent-link waits (S10 system scenarios)."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"
