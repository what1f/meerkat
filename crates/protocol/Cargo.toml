[package]
name = "lankide-protocol"
version.workspace = true
edition.workspace = true
description = "Runtime and Computer wire DTOs for Lankide"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hyper-util.workspace = true
lankide-core = { path = "../core" }
prost.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tower.workspace = true

[build-dependencies]
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.lankide.e2e]
command = "cargo test -p lankide-protocol --test protocol_e2e"
scenario = "Exchange Runtime-Computer frames, multi-chunk resources, attachment-only and text message sends, typed management operations, subscriptions, and authorized Agent CLI calls over real UDS/gRPC; replay after reconnect and reject empty messages plus version, size, sequence, offset, and token errors."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"
