[package]
autotests = false
name = "lankide-protocol"
version.workspace = true
edition.workspace = true
description = "Runtime and Computer wire DTOs for Lankide"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rustls.workspace = true
tokio-rustls.workspace = true
async-trait.workspace = true
base64 = "0.23.1"
subtle = "2.6"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
futures-util.workspace = true
tokio-tungstenite.workspace = true
uuid.workspace = true
hyper-util.workspace = true
lankide-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-stream.workspace = true

[dev-dependencies]
lankide-client = { path = "../client" }
tempfile.workspace = true

[package.metadata.lankide.e2e]
command = "cargo test -p lankide-protocol --test e2e protocol_e2e::"
scenario = "Exchange Runtime-Computer frames, multi-chunk resources, attachment-only and text message sends, typed management operations, subscriptions, and authorized Agent CLI calls over authenticated JSON/WS Computer links and owner-authenticated HTTP JSON management and event WebSocket subscriptions with Agent resource and capability calls through private Computer JSON sockets; replay after reconnect and reject empty messages plus typed version, size, sequence, offset, and token errors. Carry structured assignment failures and expose per-attempt execution diagnostics through management. Carry management cancellation for an execution through the validated public transport. Carry Harness capability declarations in Computer inventory and cancellation close fallback without a storage schema change. Expose Agent pause reasons and a validated owner resume operation. Serve Computer HTTP resource downloads with attempt tokens and byte ranges on the WS listener; Agent resource calls use the Computer proxy. Exchange two-sided JSON heartbeats and bound WebSocket upgrade, hello, and silent-link waits (S10 system scenarios). Carry pairing HTTP requests, device credentials in hello, typed unknown/revoked link rejection, and CreatePairingCode/RevokeComputer management operations. Carry correlated capability_request/response frames with bounded JSON payload chunks, execution context, and typed status errors. Agent capabilities use JSON on private Computer sockets and the Computer link; production Runtime management uses HTTP/WS (S15 and S17 system scenarios). Verify native length-prefixed JSON Agent calls, token isolation, management exclusion, version rejection, owner-only socket permissions, and request length limits (S17). Serve a separate Computer-only TLS entry point, pin SHA-256 certificates with handshake signature verification, restrict plaintext links to loopback, and carry owner-authenticated live remote address operations. Include execution-level error code and detail in management execution details. Carry global Computer catalog change events through validated management subscriptions (system-management-http scenario). Carry Computer rename and automatic remote-access enablement through the authenticated management boundary."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[lib]
test = false
