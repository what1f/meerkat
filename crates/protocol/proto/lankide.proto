syntax = "proto3";

package lankide.protocol.v1;

service RuntimeProtocol {
  rpc ConnectComputer(stream ComputerFrame) returns (stream RuntimeFrame);
  rpc UploadResource(stream ResourceChunk) returns (ResourceRef);
  rpc DownloadResource(ResourceRequest) returns (stream ResourceChunk);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc GetWorkspace(GetWorkspaceRequest) returns (Workspace);
  rpc GetWorkspaceImage(WorkspaceImageRequest) returns (WorkspaceImageResponse);
  rpc UploadWorkspaceImage(UploadWorkspaceImageRequest) returns (UploadWorkspaceImageResponse);
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (Workspace);
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (Workspace);
  rpc SetWorkspaceState(SetWorkspaceStateRequest) returns (Workspace);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetAgent(GetAgentRequest) returns (Agent);
  rpc GetExecutionDetails(GetExecutionDetailsRequest) returns (ExecutionDetails);
  rpc GetAgentAvatar(GetAgentAvatarRequest) returns (GetAgentAvatarResponse);
  rpc CreateAgent(CreateAgentRequest) returns (Agent);
  rpc UpdateAgent(UpdateAgentRequest) returns (Agent);
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);
  rpc GetProviderOnboarding(GetProviderOnboardingRequest) returns (ProviderOnboardingState);
  rpc AdvanceProviderOnboarding(AdvanceProviderOnboardingRequest) returns (ProviderOnboardingState);
  rpc GetAgentOnboarding(GetAgentOnboardingRequest) returns (AgentOnboardingState);
  rpc AdvanceAgentOnboarding(AdvanceAgentOnboardingRequest) returns (AgentOnboardingState);
  rpc GetProviderCatalog(CatalogRequest) returns (ProviderCatalog);
  rpc GetComputerCatalog(CatalogRequest) returns (ComputerCatalog);
  rpc GetHarnessCatalog(CatalogRequest) returns (HarnessCatalog);
  rpc GetModelCatalog(ModelCatalogRequest) returns (ModelCatalog);
  rpc GetReactionCatalog(CatalogRequest) returns (ReactionCatalog);
  rpc SubscribeManagementEvents(ManagementSubscription) returns (stream ManagementEvent);
  rpc ListProviderInterfaces(ListProviderInterfacesRequest) returns (ListProviderInterfacesResponse);
  rpc InvokeProviderInterface(InvokeProviderInterfaceRequest) returns (InvokeProviderInterfaceResponse);
  rpc ListCapabilities(AgentRunContext) returns (CapabilityList);
  rpc GetSelfProfile(AgentRunContext) returns (AgentProfile);
  rpc UpdateSelfProfile(UpdateSelfProfileRequest) returns (AgentProfile);
  rpc InvokeCapability(CapabilityInvokeRequest) returns (CapabilityInvokeResult);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResult);
  rpc GetContent(ContentRequest) returns (ContentResult);
}

message WorkspaceRef { string workspace_id = 1; }
message AgentRef { string workspace_id = 1; string agent_id = 2; }
message DeleteAgentRequest { string request_id = 1; AgentRef agent = 2; }
message DeleteAgentResponse { string request_id = 1; AgentRef agent = 2; }
message ExecutionRef { int64 execution_id = 1; uint32 attempt = 2; }
message ResourceRef {
  int64 resource_id = 1;
  string file_name = 2;
  string media_type = 3;
  uint64 size_bytes = 4;
  string sha256 = 5;
}

message InvokeProviderInterfaceRequest {
  string request_id = 1;
  WorkspaceRef workspace = 2;
  string interface_id = 3;
  string input_json = 4;
}
message ListProviderInterfacesRequest {
  string request_id = 1;
  WorkspaceRef workspace = 2;
}
message ProviderInterface {
  string interface_id = 1;
  optional string description = 2;
  string input_schema_json = 3;
  string output_schema_json = 4;
}
message ListProviderInterfacesResponse {
  string request_id = 1;
  WorkspaceRef workspace = 2;
  repeated ProviderInterface interfaces = 3;
}
message InvokeProviderInterfaceResponse {
  string request_id = 1;
  WorkspaceRef workspace = 2;
  string interface_id = 3;
  string output_json = 4;
}

enum HarnessAvailability {
  HARNESS_AVAILABILITY_UNSPECIFIED = 0;
  HARNESS_AVAILABILITY_AVAILABLE = 1;
  HARNESS_AVAILABILITY_UNAVAILABLE = 2;
  HARNESS_AVAILABILITY_UNKNOWN = 3;
}

message HarnessInfo {
  string harness_id = 1;
  string display_name = 2;
  HarnessAvailability availability = 3;
  string version = 4;
  string reason = 5;
  optional ModelCatalog model_catalog = 6;
  string model_catalog_error = 7;
}

message ComputerHello {
  uint32 protocol_version = 1;
  string computer_id = 2;
  string instance_id = 3;
  string computer_version = 4;
  string os = 5;
  string arch = 6;
  repeated HarnessInfo harnesses = 7;
}

message RuntimeHello {
  uint32 protocol_version = 1;
  string runtime_instance_id = 2;
  uint64 heartbeat_interval_ms = 3;
  uint64 max_message_bytes = 4;
}

message ActiveAttempt {
  ExecutionRef execution = 1;
  uint64 last_event_sequence = 2;
  string harness_process_state = 3;
}

message ComputerHeartbeat {
  string computer_id = 1;
  string instance_id = 2;
  int64 sent_at = 3;
  repeated ActiveAttempt active_attempts = 4;
}

message AgentRuntimeProfile {
  AgentRef agent = 1;
  string name = 2;
  string role = 3;
  string bio = 4;
}

message EnvironmentVariable { string name = 1; string value = 2; }
message EnvironmentVariableSet { repeated EnvironmentVariable entries = 1; }

message HarnessConfig {
  string harness_id = 1;
  string executable_path = 2;
  string model = 3;
  string thinking_level = 4;
  repeated EnvironmentVariable environment_variables = 5;
}

enum SessionAction {
  SESSION_ACTION_UNSPECIFIED = 0;
  SESSION_ACTION_RESUME_OR_START = 1;
  SESSION_ACTION_START_NEW = 2;
}

message SessionDirective {
  string logical_session_id = 1;
  SessionAction action = 2;
  optional string native_session_id = 3;
  string config_fingerprint = 4;
}

enum DeliveryKind {
  DELIVERY_KIND_UNSPECIFIED = 0;
  DELIVERY_KIND_INITIAL = 1;
  DELIVERY_KIND_STEER = 2;
}

message Delivery {
  int64 delivery_id = 1;
  DeliveryKind kind = 2;
  string rendered_markdown = 3;
  int64 snapshot_id = 4;
  repeated string trigger_reasons = 5;
  repeated ResourceRef resources = 6;
  int64 created_at = 7;
}

message ToolDefinition {
  string name = 1;
  string description = 2;
  string input_schema_json = 3;
  string output_schema_json = 4;
}

message CliCommand {
  string name = 1;
  string description = 2;
  repeated string argv = 3;
}

message AssignExecution {
  ExecutionRef execution = 1;
  WorkspaceRef workspace = 2;
  AgentRuntimeProfile agent = 3;
  HarnessConfig harness = 4;
  SessionDirective session = 5;
  Delivery initial_delivery = 6;
  string system_prompt = 7;
  repeated ToolDefinition tools = 8;
  repeated CliCommand cli_commands = 9;
  repeated ResourceRef resources = 10;
  string execution_token = 11;
  int64 created_at = 12;
}

message AttemptFailure {
  string code = 1;
  string category = 2;
  bool retryable = 3;
  string fingerprint = 4;
  string detail = 5;
}

message GetExecutionDetailsRequest { string request_id = 1; int64 execution_id = 2; }
message ExecutionAttemptDetails {
  uint32 attempt = 1;
  string computer_id = 2;
  string state = 3;
  AttemptFailure failure = 4;
}
message ExecutionDetails {
  int64 execution_id = 1;
  string state = 2;
  repeated ExecutionAttemptDetails attempts = 3;
}

message AssignmentResult {
  ExecutionRef execution = 1;
  bool accepted = 2;
  string error_code = 3;
  string error_message = 4;
  AttemptFailure failure = 5;
}

enum ExecutionEventKind {
  EXECUTION_EVENT_KIND_UNSPECIFIED = 0;
  EXECUTION_EVENT_KIND_STARTED = 1;
  EXECUTION_EVENT_KIND_NATIVE_SESSION_BOUND = 2;
  EXECUTION_EVENT_KIND_ASSISTANT_DELTA = 3;
  EXECUTION_EVENT_KIND_REASONING_DELTA = 4;
  EXECUTION_EVENT_KIND_TOOL_STARTED = 5;
  EXECUTION_EVENT_KIND_TOOL_FINISHED = 6;
  EXECUTION_EVENT_KIND_USAGE = 7;
  EXECUTION_EVENT_KIND_WARNING = 8;
  EXECUTION_EVENT_KIND_COMPLETED = 9;
  EXECUTION_EVENT_KIND_FAILED = 10;
  EXECUTION_EVENT_KIND_CANCELLED = 11;
}

message ExecutionEvent {
  ExecutionRef execution = 1;
  uint64 sequence = 2;
  int64 occurred_at = 3;
  ExecutionEventKind kind = 4;
  bytes payload = 5;
}

message ExecutionEventAck {
  ExecutionRef execution = 1;
  uint64 max_saved_sequence = 2;
}

message ExecutionCommitted { ExecutionRef execution = 1; int64 committed_at = 2; }

message DeliverSteer { ExecutionRef execution = 1; Delivery delivery = 2; }
message CancelExecution { ExecutionRef execution = 1; string reason = 2; }

message DeliveryResult {
  ExecutionRef execution = 1;
  int64 delivery_id = 2;
  bool accepted = 3;
  string error_code = 4;
  string error_message = 5;
}

message ToolCall {
  ExecutionRef execution = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string arguments_json = 4;
  string execution_token = 5;
}

message ToolError { string code = 1; string message = 2; bool retryable = 3; }

message ToolResult {
  ExecutionRef execution = 1;
  string tool_call_id = 2;
  bool success = 3;
  string content_markdown = 4;
  string structured_content_json = 5;
  repeated ResourceRef resources = 6;
  ToolError error = 7;
}

message Shutdown { string reason = 1; }

message ResourceTransferResult {
  string transfer_id = 1;
  bool success = 2;
  string error_code = 3;
  string error_message = 4;
}

message DeleteAgentFiles {
  string request_id = 1;
  AgentRef agent = 2;
}

message DeleteAgentFilesResult {
  string request_id = 1;
  bool success = 2;
  string error_code = 3;
  string error_message = 4;
}

message InventoryChanged { repeated HarnessInfo harnesses = 1; }

message ComputerFrame {
  oneof frame {
    ComputerHello hello = 1;
    ComputerHeartbeat heartbeat = 2;
    AssignmentResult assignment_result = 3;
    ExecutionEvent execution_event = 4;
    DeliveryResult delivery_result = 5;
    ToolCall tool_call = 6;
    ResourceTransferResult resource_transfer_result = 7;
    InventoryChanged inventory_changed = 8;
    DeleteAgentFilesResult delete_agent_files_result = 9;
  }
}

message RuntimeFrame {
  oneof frame {
    RuntimeHello hello = 1;
    AssignExecution assign_execution = 2;
    DeliverSteer deliver_steer = 3;
    CancelExecution cancel_execution = 4;
    ToolResult tool_result = 5;
    ExecutionEventAck execution_event_ack = 6;
    ExecutionCommitted execution_committed = 7;
    Shutdown shutdown = 8;
    DeleteAgentFiles delete_agent_files = 9;
  }
}

message ResourceDescriptor {
  string file_name = 1;
  string media_type = 2;
  uint64 size_bytes = 3;
  string sha256 = 4;
  AgentRunContext context = 5;
}

message ResourceChunk {
  string transfer_id = 1;
  int64 resource_id = 2;
  uint64 offset = 3;
  bytes bytes = 4;
  bool eof = 5;
  ResourceDescriptor descriptor = 6;
}

message ResourceRequest {
  int64 resource_id = 1;
  string transfer_id = 2;
  AgentRunContext context = 3;
}

enum DesiredState {
  DESIRED_STATE_UNSPECIFIED = 0;
  DESIRED_STATE_RUNNING = 1;
  DESIRED_STATE_PAUSED = 2;
}

enum ObservedState {
  OBSERVED_STATE_UNSPECIFIED = 0;
  OBSERVED_STATE_STARTING = 1;
  OBSERVED_STATE_RUNNING = 2;
  OBSERVED_STATE_PAUSED = 3;
  OBSERVED_STATE_ERROR = 4;
  OBSERVED_STATE_STOPPED = 5;
}

message Workspace {
  WorkspaceRef workspace = 1;
  string name = 2;
  ResourceRef cover = 3;
  string rules = 4;
  string provider_id = 5;
  string provider_config_json = 6;
  DesiredState desired_state = 7;
  ObservedState observed_state = 8;
  string status_message = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

message ListWorkspacesRequest { string request_id = 1; }
message ListWorkspacesResponse { string request_id = 1; repeated Workspace workspaces = 2; }
message GetWorkspaceRequest { string request_id = 1; WorkspaceRef workspace = 2; }

message CreateWorkspaceRequest {
  string request_id = 1;
  string workspace_id = 2;
  string name = 3;
  string rules = 4;
  string provider_id = 5;
  string provider_config_json = 6;
  string provider_secrets_json = 7;
}

message UpdateWorkspaceRequest {
  string request_id = 1;
  WorkspaceRef workspace = 2;
  optional string name = 3;
  optional string rules = 4;
  optional string provider_config_json = 5;
  optional int64 cover_resource_id = 6;
  optional string provider_secrets_json = 7;
}

message SetWorkspaceStateRequest {
  string request_id = 1;
  WorkspaceRef workspace = 2;
  DesiredState desired_state = 3;
}

message Agent {
  AgentRef agent = 1;
  string name = 2;
  string role = 3;
  string bio = 4;
  string avatar_path = 5;
  string harness_id = 6;
  string model = 7;
  string thinking_level = 8;
  string auto_reaction = 9;
  string soul = 10;
  string cli_path = 11;
  repeated EnvironmentVariable environment_variables = 12;
  string computer_id = 13;
  int64 created_at = 14;
  int64 updated_at = 15;
  AgentAttention attention = 16;
  string provider_agent_config_json = 17;
}

enum AttentionMode {
  ATTENTION_MODE_UNSPECIFIED = 0;
  ATTENTION_MODE_MENTION = 1;
  ATTENTION_MODE_ALWAYS = 2;
  ATTENTION_MODE_MUTE = 3;
  ATTENTION_MODE_SCHEDULE = 4;
}
message ChannelAttention {
  string channel_id = 1;
  AttentionMode mode = 2;
  uint32 interval_minutes = 3;
}
message AgentAttention { repeated ChannelAttention channels = 1; }

message ListAgentsRequest { string request_id = 1; WorkspaceRef workspace = 2; }
message ListAgentsResponse { string request_id = 1; repeated Agent agents = 2; }
message GetAgentRequest { string request_id = 1; AgentRef agent = 2; }
message GetAgentAvatarRequest { string request_id = 1; AgentRef agent = 2; }

message AgentAvatarUpload {
  string media_type = 1;
  bytes bytes = 2;
}

message AgentAvatarFile {
  string path = 1;
  string media_type = 2;
  bytes bytes = 3;
}

message GetAgentAvatarResponse {
  string request_id = 1;
  AgentRef agent = 2;
  AgentAvatarFile avatar = 3;
}

message CreateAgentRequest {
  string request_id = 1;
  AgentRef agent = 2;
  string name = 3;
  string role = 4;
  string bio = 5;
  string harness_id = 6;
  string model = 7;
  string thinking_level = 8;
  string auto_reaction = 9;
  string soul = 10;
  string cli_path = 11;
  repeated EnvironmentVariable environment_variables = 12;
  string computer_id = 13;
  AgentAttention attention = 14;
  string provider_agent_config_json = 15;
  string provider_agent_secrets_json = 16;
}

message UpdateAgentRequest {
  string request_id = 1;
  AgentRef agent = 2;
  optional string name = 3;
  optional string role = 4;
  optional string bio = 5;
  optional string harness_id = 6;
  optional string model = 7;
  optional string thinking_level = 8;
  optional string auto_reaction = 9;
  optional string soul = 10;
  optional string cli_path = 11;
  EnvironmentVariableSet environment_variables = 12;
  optional string computer_id = 13;
  AgentAvatarUpload avatar = 14;
  AgentAttention attention = 15;
  optional string provider_agent_config_json = 16;
  optional string provider_agent_secrets_json = 17;
}

enum OnboardingStatus {
  ONBOARDING_STATUS_UNSPECIFIED = 0;
  ONBOARDING_STATUS_ACTION_REQUIRED = 1;
  ONBOARDING_STATUS_VERIFYING = 2;
  ONBOARDING_STATUS_READY = 3;
  ONBOARDING_STATUS_ERROR = 4;
}

message ProviderOnboardingState {
  WorkspaceRef workspace = 1;
  string provider_id = 2;
  string step = 3;
  OnboardingStatus status = 4;
  reserved 5, 6, 7;
  reserved "title", "instruction", "fields";
  string payload_json = 10;
  string verification_uri = 11;
  uint32 poll_interval_seconds = 12;
  string error_code = 8;
  string error_message = 9;
}

message GetProviderOnboardingRequest { string request_id = 1; WorkspaceRef workspace = 2; }
message AdvanceProviderOnboardingRequest {
  string request_id = 1;
  WorkspaceRef workspace = 2;
  string action = 3;
  string field_values_json = 4;
}

message AgentOnboardingState {
  AgentRef agent = 1;
  string provider_id = 2;
  string step = 3;
  OnboardingStatus status = 4;
  reserved 5, 6, 7;
  reserved "title", "instruction", "fields";
  string payload_json = 10;
  string verification_uri = 11;
  uint32 poll_interval_seconds = 12;
  string error_code = 8;
  string error_message = 9;
}
message GetAgentOnboardingRequest { string request_id = 1; AgentRef agent = 2; }
message AdvanceAgentOnboardingRequest {
  string request_id = 1;
  AgentRef agent = 2;
  string action = 3;
  string field_values_json = 4;
}

message CatalogRequest { string request_id = 1; optional WorkspaceRef workspace = 2; }
message ProviderCatalogItem {
  string provider_id = 1;
  string display_name = 2;
  string description = 3;
  bool available = 4;
  repeated string capabilities = 5;
}
message ProviderCatalog { repeated ProviderCatalogItem providers = 1; }

message ComputerCatalogItem {
  string computer_id = 1;
  string display_name = 2;
  ObservedState observed_state = 3;
  repeated HarnessInfo harnesses = 4;
  string status_message = 5;
}
message ComputerCatalog { repeated ComputerCatalogItem computers = 1; }

message HarnessCatalogItem {
  string harness_id = 1;
  string display_name = 2;
  string description = 3;
  HarnessAvailability availability = 4;
  repeated string supported_thinking_levels = 5;
}
message HarnessCatalog { repeated HarnessCatalogItem harnesses = 1; }

message ModelCatalogRequest {
  string request_id = 1;
  optional WorkspaceRef workspace = 2;
  string computer_id = 3;
  string harness_id = 4;
}
message ModelCatalogItem {
  string model_id = 1;
  string display_name = 2;
  string description = 3;
  bool available = 4;
  repeated string supported_thinking_levels = 5;
}
message ModelCatalog { repeated ModelCatalogItem models = 1; }

message ReactionCatalogItem {
  string reaction_id = 1;
  string display_name = 2;
  string emoji = 3;
  bool available = 4;
}
message ReactionCatalog { repeated ReactionCatalogItem reactions = 1; }

enum ManagementEventKind {
  MANAGEMENT_EVENT_KIND_UNSPECIFIED = 0;
  MANAGEMENT_EVENT_KIND_WORKSPACE_CREATED = 1;
  MANAGEMENT_EVENT_KIND_WORKSPACE_UPDATED = 2;
  MANAGEMENT_EVENT_KIND_WORKSPACE_STATE_CHANGED = 3;
  MANAGEMENT_EVENT_KIND_AGENT_CREATED = 4;
  MANAGEMENT_EVENT_KIND_AGENT_UPDATED = 5;
  MANAGEMENT_EVENT_KIND_PROVIDER_ONBOARDING_CHANGED = 6;
  MANAGEMENT_EVENT_KIND_CATALOG_CHANGED = 7;
  MANAGEMENT_EVENT_KIND_AGENT_DELETED = 8;
}

message ManagementSubscription {
  string request_id = 1;
  optional WorkspaceRef workspace = 2;
  uint64 after_sequence = 3;
}
message ManagementEvent {
  uint64 sequence = 1;
  int64 occurred_at = 2;
  ManagementEventKind kind = 3;
  WorkspaceRef workspace = 4;
  AgentRef agent = 5;
}

message AgentRunContext {
  ExecutionRef execution = 1;
  string execution_token = 2;
}

enum CapabilityKind {
  CAPABILITY_KIND_UNSPECIFIED = 0;
  CAPABILITY_KIND_TOOL = 1;
  CAPABILITY_KIND_CLI_COMMAND = 2;
  CAPABILITY_KIND_PROVIDER_INTERFACE = 3;
}
message Capability {
  string name = 1;
  string display_name = 2;
  string description = 3;
  CapabilityKind kind = 4;
  string input_schema_json = 5;
  string output_schema_json = 6;
}
message CapabilityList { repeated Capability capabilities = 1; }
message AgentProfile {
  AgentRef agent = 1;
  string name = 2;
  string role = 3;
  string bio = 4;
  AgentAvatarFile avatar = 5;
}
message UpdateSelfProfileRequest {
  AgentRunContext context = 1;
  optional string name = 2;
  optional string role = 3;
  optional string bio = 4;
  AgentAvatarUpload avatar = 5;
}
message CapabilityInvokeRequest {
  AgentRunContext context = 1;
  string capability_name = 2;
  string arguments_json = 3;
  string invocation_id = 4;
}
message CapabilityInvokeResult {
  string invocation_id = 1;
  bool success = 2;
  string content_markdown = 3;
  string structured_content_json = 4;
  repeated ResourceRef resources = 5;
  ToolError error = 6;
}

message SendMessageRequest {
  AgentRunContext context = 1;
  string channel_id = 2;
  string chat_id = 3;
  string content_markdown = 4;
  optional int64 reply_to_message_id = 5;
  repeated ResourceRef resources = 6;
  string idempotency_key = 7;
  bool force = 8;
}
message SendMessageResult {
  bool accepted = 1;
  int64 message_id = 2;
  string provider_message_id = 3;
  ToolError error = 4;
}

enum ContentKind {
  CONTENT_KIND_UNSPECIFIED = 0;
  CONTENT_KIND_MESSAGE = 1;
  CONTENT_KIND_TASK = 2;
  CONTENT_KIND_PROVIDER_OBJECT = 3;
}
message ContentRequest {
  AgentRunContext context = 1;
  ContentKind kind = 2;
  string content_id = 3;
}
message ContentResult {
  string content_id = 1;
  string content_markdown = 2;
  string structured_content_json = 3;
  repeated ResourceRef resources = 4;
}

message WorkspaceImageRequest {
  string request_id = 1;
  WorkspaceRef workspace = 2;
  int64 resource_id = 3;
}
message WorkspaceImageResponse {
  string request_id = 1;
  WorkspaceRef workspace = 2;
  ResourceRef resource = 3;
  bytes bytes = 4;
}
message UploadWorkspaceImageRequest {
  string request_id = 1;
  WorkspaceRef workspace = 2;
  string file_name = 3;
  string media_type = 4;
  bytes bytes = 5;
}
message UploadWorkspaceImageResponse {
  string request_id = 1;
  WorkspaceRef workspace = 2;
  ResourceRef resource = 3;
}
