[package]
autotests = false
name = "meerkat-runtime"
version.workspace = true
edition.workspace = true
description = "Meerkat Runtime orchestration boundary"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
log.workspace = true
uuid.workspace = true
getrandom = "0.3"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
base64 = "0.23.1"
async-trait.workspace = true
subtle = "2.6.1"
croner = { version = "4.0.3", default-features = false, features = ["jiff"] }
jiff = "1.0.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
jimu-ai.workspace = true
jimu-http.workspace = true
meerkat-core = { path = "../core" }
meerkat-protocol = { path = "../protocol" }
meerkat-provider = { path = "../provider" }
meerkat-storage = { path = "../storage" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-stream.workspace = true

[dev-dependencies]
meerkat-client = { path = "../client" }
rusqlite.workspace = true
tempfile.workspace = true

[package.metadata.meerkat.e2e]
command = "cargo test -p meerkat-runtime --test e2e runtime_e2e::"
scenario = "Ingest Provider events across Workspaces, freeze multi-Chat snapshots, queue messages received during active work for the next Agent run, release scheduling after failed and cancelled executions, preserve Agent profile updates and roll back failed lifecycle changes, hard-delete Agents over HTTP management with durable Machine cleanup, deliver idempotent Tool and message outcomes, recover durable ingress after a failed commit, drain active work across pause, advance cursors only after accepted delivery, and release background tasks and storage on application shutdown. Store structured spawn and terminal failures and serve execution details without changing retries. Forward execution cancellation requested through management without changing the retry schedule. Direct messages and reactions dispatch only to the receiving Agent; unaddressed direct messages are dropped. Use inventory capability declarations for resume, steering, and cancellation with close fallback. Store structured spawn and terminal failures and serve execution details under the configured retry policy. Apply bounded category-based backoff, pause repeated fingerprints, preserve queued messages while paused, and send durable localized notices through the Agent identity. Authorize HTTP resources against live attempts and workspace ownership; configure newly issued execution token lifetimes without changing storage. Acknowledge events after durable commit and deduplicate replay across Machine process restarts without changing storage schema (S10.1-S10.4 system scenarios). Register Machines with hashed device credentials, issue single-use expiring pairing codes, persist offline catalog entries, update hello/heartbeat inventory, and revoke live links with terminal reasons (S12 system scenarios). Keep attempt completion waiters across link loss, reconcile before dispatch, and reserve Agents reported active by the Machine even after lease expiry. Requeue ownership conflicts without Harness failure counters or chat notices. Close attempts that expired offline when their Machine returns and acknowledge abandoned terminal outboxes before queued work resumes. Validate Agent placement against persisted registration and inventory; reject Machine events and capability or resource access from an old placement generation or revoked Machine, cancel stale runs, and keep offline work queued without Harness failure counts (S13 system scenarios). Exercise management over owner-authenticated HTTP JSON and event WebSocket subscriptions. Keep Machine delivery and Agent capabilities on authenticated JSON/WS through private Machine proxies. Answer capability_request frames through existing token and capability validation without schema or token issuance changes; reject finished attempts and bound per-link request assembly and dispatch (S15 system scenarios). Capability payloads use JSON and protocol-owned typed errors (S17). Recover interrupted preparation without an attempt, route management cancellation to surviving durable attempts after Runtime crash, apply bounded backoff to Machine loss, and include attachment references beside each message in Harness snapshots (system reliability and resource scenarios). Encode single-use 256-bit pairing codes as unpadded URL-safe base64. Preserve a safe input preparation reason on the execution, retain the 60-second retry, and serve the reason through management after restart before any Machine attempt. Failed Provider Tools return a prompt failed capability result and let the Harness continue; bot reactions wake only the reacted-to Agent author, while human reactions retain group dispatch. Retry queued work and expire lost Machine attempts independently of Provider event intake; keep management reads responsive during concurrent Workspace conversations and close storage after all cancelled database operations release it. A paused Workspace still records loss of its offline Machine attempt; queued work retries once after the owner resumes it.. Notify management subscribers after Machine pairing, online reconciliation, inventory change, disconnect and revocation; a subscriber observes catalog changes and resubscribes after Runtime restart (system-management-http scenario). Resolve inbound Agent sender names from Runtime profiles and render reaction senders, emoji, target message IDs and short previews in initial Harness delivery, including already-read targets (system reaction/name scenarios). Record multipart sends and drop early or late Agent echoes by sender identity, dispatch canonical mentions once without waking the sender, retain attachments, and log send-path errors. Send first direct messages to known human team members through the same gateway and canonical history. Dispatch explicit custom-event mentions without waking their actor. Drop inbound Agent messages by workspace sender identity before persistence, including echoes before send completion; preserve canonical send mentions, multipart reply and reaction ownership, and human message processing during another Agent upload. A DM-woken Agent reads and posts in a received group outside its initial task; unread conversations require chat_messages, later group messages block sends until reread, and nonmember conversations stay inaccessible. Rename Machines with trimmed bounded names, publish catalog changes, and refuse removal of local or assigned Machines before revoking idle remote Machines. Reuse the sole local Machine identity and rotate only its credentials atomically during automatic re-pairing; preserve assigned Agent execution across Runtime restart (system-management-dto scenario). A4a imports workspace figure resources, validates figure selection, publishes execution activity transitions and serves Machine model catalogs; cross-module acceptance is in system-member-fields. Additional human team enrollment, task invalidation and first-reply behavior is covered by system-provider-management. A4c routes bounded synchronous Harness tests only to the selected online Machine without persistence or management events; acceptance is in system-harness-test. Preserve the user-requested Workspace shift across Provider startup and reconfiguration failures, record setup errors and clear them on recovery (system-startup). Human contact profiles and tenant-only creator identity are covered by system-provider-management. Replace an idle native session above the context threshold with a fresh one seeded from recent stored conversations, leaving unread messages to the delivery. An Agent sets, lists and cancels its own timers in conversations it belongs to; impossible times are refused with a reason; the owner lists, removes and restores them; a due timer wakes the Agent once in its conversation with the note it left."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[lib]
test = false
