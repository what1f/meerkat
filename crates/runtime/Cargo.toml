[package]
name = "lankide-runtime"
version.workspace = true
edition.workspace = true
description = "Lankide Runtime orchestration boundary"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
subtle = "2.6.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
lankide-core = { path = "../core" }
lankide-protocol = { path = "../protocol" }
lankide-provider = { path = "../provider" }
