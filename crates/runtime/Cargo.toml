[package.metadata.lankide.e2e]
command = "cargo test -p lankide-runtime --test runtime_e2e"
scenario = "Ingest Provider events across Workspaces, freeze multi-Chat snapshots, queue messages received during active work for the next Agent run, release scheduling after failed and cancelled executions, preserve Agent profile updates and roll back failed lifecycle changes, hard-delete Agents over HTTP management with durable Computer cleanup, deliver idempotent Tool and message outcomes, recover durable ingress after a failed commit, drain active work across pause, advance cursors only after accepted delivery, and release background tasks and storage on application shutdown. Store structured spawn and terminal failures and serve execution details without changing retries. Forward execution cancellation requested through management without changing the retry schedule. Direct messages and reactions dispatch only to the receiving Agent; unaddressed direct messages are dropped. Use inventory capability declarations for resume, steering, and cancellation with close fallback. Store structured spawn and terminal failures and serve execution details under the configured retry policy. Apply bounded category-based backoff, pause repeated fingerprints, preserve queued messages while paused, and send durable localized notices through the Agent identity. Authorize HTTP resources against live attempts and workspace ownership; configure newly issued execution token lifetimes without changing storage. Acknowledge events after durable commit and deduplicate replay across Computer process restarts without changing storage schema (S10.1-S10.4 system scenarios). Register Computers with hashed device credentials, issue single-use expiring pairing codes, persist offline catalog entries, update hello/heartbeat inventory, and revoke live links with terminal reasons (S12 system scenarios). Keep attempt completion waiters across link loss, reconcile before dispatch, and reserve Agents reported active by the Computer even after lease expiry. Requeue ownership conflicts without Harness failure counters or chat notices. Close attempts that expired offline when their Computer returns and acknowledge abandoned terminal outboxes before queued work resumes. Validate Agent placement against persisted registration and inventory; reject Computer events and capability or resource access from an old placement generation or revoked Computer, cancel stale runs, and keep offline work queued without Harness failure counts (S13 system scenarios). Exercise management over owner-authenticated HTTP JSON and event WebSocket subscriptions. Keep Computer delivery and Agent capabilities on authenticated JSON/WS through private Computer proxies. Answer capability_request frames through existing token and capability validation without schema or token issuance changes; reject finished attempts and bound per-link request assembly and dispatch (S15 system scenarios). Capability payloads use JSON and protocol-owned typed errors (S17). Recover interrupted preparation without an attempt, route management cancellation to surviving durable attempts after Runtime crash, apply bounded backoff to Computer loss, and include attachment references beside each message in Harness snapshots (system reliability and resource scenarios). Encode single-use 256-bit pairing codes as unpadded URL-safe base64. Preserve a safe input preparation reason on the execution, retain the 60-second retry, and serve the reason through management after restart before any Computer attempt. Failed Provider Tools return a prompt failed capability result and let the Harness continue; bot reactions wake only the reacted-to Agent author, while human reactions retain group dispatch. Retry queued work and expire lost Computer attempts independently of Provider event intake; keep management reads responsive during concurrent Workspace conversations and close storage after all cancelled database operations release it. A paused Workspace still records loss of its offline Computer attempt; queued work retries once after the owner resumes it.. Notify management subscribers after Computer pairing, online reconciliation, inventory change, disconnect and revocation; a subscriber observes catalog changes and resubscribes after Runtime restart (system-management-http scenario). Resolve inbound Agent sender names from Runtime profiles and render reaction senders, emoji, target message IDs and short previews in initial Harness delivery, including already-read targets (system reaction/name scenarios). Record multipart sends and drop early or late Agent echoes by sender identity, dispatch canonical mentions once without waking the sender, retain attachments, and log send-path errors. Send first direct messages to known human team members through the same gateway and canonical history. Dispatch explicit custom-event mentions without waking their actor. Drop inbound Agent messages by workspace sender identity before persistence, including echoes before send completion; preserve canonical send mentions, multipart reply and reaction ownership, and human message processing during another Agent upload. A DM-woken Agent reads and posts in a received group outside its initial task; unread conversations require chat_messages, later group messages block sends until reread, and nonmember conversations stay inaccessible. Rename Computers with trimmed bounded names, publish catalog changes, and refuse removal of local or assigned Computers before revoking idle remote Computers."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"
