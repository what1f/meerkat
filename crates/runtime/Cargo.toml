rusqlite.workspace = true
tempfile.workspace = true

[package.metadata.lankide.e2e]
command = "cargo test -p lankide-runtime --test runtime_e2e"
scenario = "Ingest Provider events across Workspaces, freeze multi-Chat snapshots, queue messages received during active work for the next Agent run, release scheduling after failed and cancelled executions, preserve Agent profile updates and roll back failed lifecycle changes, hard-delete Agents over HTTP management with durable Computer cleanup, deliver idempotent Tool and message outcomes, recover durable ingress after a failed commit, drain active work across pause, advance cursors only after accepted delivery, and release background tasks and storage on application shutdown. Store structured spawn and terminal failures and serve execution details without changing retries. Forward execution cancellation requested through management without changing the retry schedule. Direct messages and reactions dispatch only to the receiving Agent; unaddressed direct messages are dropped. Use inventory capability declarations for resume, steering, and cancellation with close fallback. Store structured spawn and terminal failures and serve execution details under the configured retry policy. Apply bounded category-based backoff, pause repeated fingerprints, preserve queued messages while paused, and send durable localized notices through the Agent identity. Authorize HTTP resources against live attempts and workspace ownership; configure newly issued execution token lifetimes without changing storage. Acknowledge events after durable commit and deduplicate replay across Computer process restarts without changing storage schema (S10.1-S10.4 system scenarios). Register Computers with hashed device credentials, issue single-use expiring pairing codes, persist offline catalog entries, update hello/heartbeat inventory, and revoke live links with terminal reasons (S12 system scenarios). Keep attempt completion waiters across link loss, reconcile before dispatch, and reserve Agents reported active by the Computer even after lease expiry. Requeue ownership conflicts without Harness failure counters or chat notices. Close attempts that expired offline when their Computer returns and acknowledge abandoned terminal outboxes before queued work resumes. Validate Agent placement against persisted registration and inventory; reject Computer events and capability or resource access from an old placement generation or revoked Computer, cancel stale runs, and keep offline work queued without Harness failure counts (S13 system scenarios). Exercise management over owner-authenticated HTTP JSON and event WebSocket subscriptions. Keep Computer delivery and Agent capabilities on authenticated JSON/WS through private Computer proxies. Answer capability_request frames through existing token and capability validation without schema or token issuance changes; reject finished attempts and bound per-link request assembly and dispatch (S15 system scenarios). Capability payloads use JSON and protocol-owned typed errors (S17). Recover interrupted preparation without an attempt, route management cancellation to surviving durable attempts after Runtime crash, apply bounded backoff to Computer loss, and include attachment references beside each message in Harness snapshots (system reliability and resource scenarios)."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"
