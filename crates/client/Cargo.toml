[package]
name = "lankide-client"
version = "0.1.0"
edition = "2024"
description = "Typed production Runtime client for the Lankide desktop"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sha2.workspace = true
lankide-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[package.metadata.lankide.e2e]
command = "cargo test -p lankide-client --test management_e2e"
scenario = "Run the same Workspace, opaque Provider onboarding, Agent, local harness inventory, catalog, lifecycle, duplicate-identity conflict, event, isolation, and retry contract through a real UDS Runtime adapter and the product Mock adapter."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"
