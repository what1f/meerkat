[package]
autotests = false
name = "meerkat-client"
version = "0.1.0"
edition = "2024"
description = "Typed production Runtime client for the Meerkat desktop"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
reqwest.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
sha2.workspace = true
meerkat-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[package.metadata.meerkat.e2e]
command = "cargo test -p meerkat-client --test e2e management_e2e::"
scenario = "Run the same Workspace, opaque Provider onboarding, Agent, local harness inventory, catalog, lifecycle, duplicate-identity conflict, event, isolation, and retry contract through local origin-checked HTTP JSON and event WebSocket management and the test-only Mock adapter. Preserve full-size image uploads with base64 JSON encoding. Expose original per-attempt failure diagnostics through execution details. Forward management cancellation and observe its terminal diagnostics through the system liveness scenarios. Expose pause reasons and resume paused Agents through management. Expose pairing-code creation, revocation, registered/online/revoked catalog state, last seen and inventory; choose the sole registered non-revoked Machine when creating an Agent without placement. Surface typed machine_not_registered, machine_revoked, and harness_unavailable_on_machine management errors without changing user-facing copy. Reuse canonical serde management DTOs and map protocol-owned typed errors (S17). Read, enable, change, and clear the remote Machine address through local origin-checked management. Expose global Machine pairing, presence, inventory and revocation events without a Workspace, including scoped subscriptions and reuse after Runtime restart (system-management-http scenario). Expose Machine rename, automatic remote-access enablement, and typed localized validation and removal errors through management."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[lib]
test = false
