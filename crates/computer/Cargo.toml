[package]
name = "lankide-computer"
version.workspace = true
edition.workspace = true
description = "Computer daemon execution boundary for Lankide"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
reqwest.workspace = true
lankide-core = { path = "../core" }
lankide-protocol = { path = "../protocol" }
lankide-harness = { path = "../harness" }
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[dev-dependencies]
tempfile.workspace = true

[package.metadata.lankide.e2e]
command = "cargo test -p lankide-computer --features test-support --test computer_e2e --test output_record_e2e"
scenario = "Run a real authenticated JSON/WS Computer peer through parallel assignments, session recovery, steer, resource and Tool routing, expand real message content files locally with failure short-circuiting, replay, cancellation, forced process cleanup, and startup expiration of output records while preserving native sessions. Report structured attempt failures and log original diagnostics with execution, attempt, Agent, and Computer IDs. Enforce configured idle and total attempt deadlines, report timeout failures, and cancel then kill isolated native process groups after the configured grace period. Declare Harness capabilities in inventory and guard resume, steer, and native cancel; close attempts when native cancellation is unavailable. Download attachments over HTTP using the discovered or configured WS base, resume partial files with Range, and reject size or SHA-256 mismatches before atomic publication."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[[bin]]
name = "computer-harness-peer"
path = "tests/fixtures/harness_peer.rs"
test = false
bench = false
required-features = ["test-support"]

[features]
test-support = []

[[test]]
name = "computer_e2e"
path = "tests/computer_e2e.rs"
required-features = ["test-support"]
