[package]
autotests = false
name = "meerkat-core"
version.workspace = true
edition.workspace = true
description = "Pure domain identifiers and state types for Meerkat"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
test = false
name = "meerkat_core"
path = "src/lib.rs"

[dependencies]
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[package.metadata.meerkat.e2e]
command = "cargo test -p meerkat-core --test e2e core_e2e::"
scenario = "Validate canonical Tool names, Markdown mentions, attention levels, schedule boundaries, and identifier validation through public constructors and deserialization. Select short English or Simplified Chinese failure notices from the triggering message."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
