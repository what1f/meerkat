[package]
name = "lankide-core"
version.workspace = true
edition.workspace = true
description = "Pure domain identifiers and state types for Lankide"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "lankide_core"
path = "src/lib.rs"

[dependencies]
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[package.metadata.lankide.e2e]
command = "cargo test -p lankide-core --test core_e2e"
scenario = "Validate canonical Tool names, Markdown mentions, attention levels, schedule boundaries, and identifier validation through public constructors and deserialization. Select short English or Simplified Chinese failure notices from the triggering message."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"
