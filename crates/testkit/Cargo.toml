[package]
name = "lankide-testkit"
version.workspace = true
edition.workspace = true
description = "Business-scenario fixtures for module E2E suites"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rusqlite.workspace = true
lankide-core = { path = "../core" }
lankide-protocol = { path = "../protocol" }
lankide-provider = { path = "../provider" }
lankide-harness = { path = "../harness" }
lankide-storage = { path = "../storage" }
lankide-runtime = { path = "../runtime" }
lankide-computer = { path = "../computer" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.lankide.e2e]
command = "cargo test -p lankide-testkit --test testkit_e2e && cargo run -p lankide-testkit --example prerequisites -- --gate hermetic --no-live"
scenario = "Run the public prerequisite probe without live dependencies, with current owner-only JSON fixtures, and verify durable scenario evidence rejects incomplete cleanup, cleanup failures, duplicate runs, and result write failures. Concurrent scenario suites use private fixture directories and publish independent evidence with the same run ID."
prerequisites = "None"
classification = "hermetic"
unattended = "yes"
status = "implemented"
