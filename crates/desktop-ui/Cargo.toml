[package]
name = "desktop-ui"
version.workspace = true
edition.workspace = true
description = "Reusable GPUI desktop components and layout primitives"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui-component.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSColor",
    "NSGraphics",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-foundation", "objc2-core-graphics"] }
raw-window-handle = "0.6"

[package.metadata.lankide.e2e]
command = "cargo test -p lankide-desktop --test desktop_interaction_e2e"
scenario = "Exercise the shared form, input, select, menu, dialog, banner and avatar components through the production Desktop composition, including empty validation, live retranslation of retained feedback, localized Provider onboarding presentation, explicit model choice, activation failure and retry, and scoped image loading. Show a paused Agent and resume it through the existing card interaction."
prerequisites = "GPUI test platform; actual-window visual review belongs to the separate Desktop gate"
classification = "hermetic"
unattended = "yes"
status = "implemented"
