[package]
name = "desktop-ui"
version.workspace = true
edition.workspace = true
description = "Reusable GPUI desktop components and layout primitives"
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui-component.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSColor",
    "NSGraphics",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-foundation", "objc2-core-graphics"] }
raw-window-handle = "0.6"

[package.metadata.lankide]
e2e-exemption = "Retained GPUI components await D1 removal; their Desktop UI scenarios were removed when C1 replaced the application shell with Tauri."

[lib]
test = false
